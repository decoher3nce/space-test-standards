# Subsystem and vehicle thermal vacuum parameters of SSC-S-016 as reported on slide 69 (pdf 70)
# of the NESC Academy deck, with the thermal-cycle-plus-thermal-vacuum alternative from the same
# slide and the vehicle thermal cycle option (standard's Appendix A) from slide 60 (pdf 61).
kind: test_parameters
id: ssc-s-016.params.thermal_vacuum_vehicle
standard: ssc-s-016
test_type: thermal_vacuum
title: Subsystem and vehicle thermal vacuum test (temperature extremes and cycles, with the TV+TC alternative)
citation: {standard: ssc-s-016, table: "Subsystem and Vehicle Thermal Test Parameters (deck slide 69)", page: "69", pdf_page: 70, note: "also deck slides 54, 57, 60 and 63 (pdf 55, 58, 61, 64); the deck gives no clause number for subsystem/vehicle thermal vacuum"}
level_of_assembly: [subsystem, element]
by_regime:
  acceptance:
    margin: {value: 0, unit: degC, relative_to: max_predicted, note: "extremes are the maximum/minimum predicted temperatures; no default screening range at these levels"}
    cycles: {value: 4, unit: cycles, note: "thermal vacuum only plan"}
    extra:
      tv_cycles_with_tc_option: {value: 2, unit: cycles, note: "thermal vacuum cycles when the optional thermal cycle test is also run"}
      tc_cycles_with_tc_option: {value: 3, unit: cycles, note: "thermal cycle cycles in the TV+TC plan"}
    footnotes: [n_mpt, n_perf, n_tc_option]
  protoflight:
    margin: {value: 5, unit: degC, relative_to: max_predicted, note: "beyond maximum and minimum predicted temperatures"}
    cycles: {value: 4, unit: cycles, note: "same count as acceptance at these levels"}
    extra:
      tv_cycles_with_tc_option: {value: 2, unit: cycles}
      tc_cycles_with_tc_option: {value: 3, unit: cycles}
    footnotes: [n_mpt, n_perf, n_tc_option, n_pq]
  qualification:
    margin: {value: 10, unit: degC, relative_to: max_predicted, note: "beyond maximum and minimum predicted temperatures"}
    cycles: {value: 8, unit: cycles}
    extra:
      tv_cycles_with_tc_option: {value: 4, unit: cycles}
      tc_cycles_with_tc_option: {value: 6, unit: cycles}
    footnotes: [n_mpt, n_tc_option]
footnotes:
  n_mpt: >
    Subsystem, payload and vehicle test temperatures come from worst-case predictions plus the
    regime margin; there is no default screening range such as -24 to +61 degC at these levels, and
    the test is divided into thermal zones whose dwell starts when the first sensor in the zone
    reaches the test temperature (deck slides 57 and 61).
  n_perf: >
    Specification performance tests on the first and last cycle, powered and monitored during
    intermediate cycles and transitions; thermal balance is run during the first cycle of the first
    vehicle thermal vacuum test (deck slides 57 and 67).
  n_tc_option: >
    A vehicle thermal cycle test preceding thermal vacuum is an option described in the standard's
    Appendix A and reduces the thermal vacuum cycle count (deck slides 60 and 69); see
    ssc-s-016.provision.vehicle_tc_option.
  n_pq: The slide heading merges "Proto-Qualification" and "Flightproof"; the deck states elsewhere that a flightproof strategy is not applicable to thermal environments.
confidence: deck_only
notes: >
  Verify against the subsystem and vehicle thermal vacuum clauses of SSC-S-016 (sections 7 and
  8, numbering to confirm) and Appendix A for the thermal cycle option.
