legend:
  R: Required
  ER: Evaluation required (see 6.3)
  "--": Not required (printed "--", in two cells as a single dash)
footnotes:
  f1: Performance tests are run before, during and after each environmental test, as appropriate.
  f2: Either vibration or acoustic is required; the other is discretionary.
  f3: Required only for composite and/or bonded structures.
  f4: Required for sealed or pressurised units, heat pipes for example.
  f5: Required when the EMC margin is less than 12 dB.
  f6: For silver-zinc batteries the requirement becomes evaluation required.
  f7: Exemptions are given in 4.10.2.
  f8: Burn-in is required.
  f9: The thruster thermal vacuum requirement may be satisfied by hot-fire testing.
  f10: Thermal vacuum testing of solar panels may be performed at solar-array level.
  f11: Required only for pressurised or hermetically sealed units.
  f12: Safety-device testing is required for lithium-ion batteries (marker on the Battery column heading).
confidence: deck_only
notes: >
  Read from slide 6 of the NESC Academy deck, not from the standard. Verify every cell, footnote
  marker and the suggested-sequence numbers against the unit acceptance test table in SSC-S-016
  section 6.3 (the deck attributes this content to the 2014 SMC-S-016 text redesignated SSC-S-016).
  Suggested sequence positions are the slide's own column (1 inspection ... 15 inspection).
