      mechanism: {code: ER, requirement: evaluate}
      solar_array: {code: ER, requirement: evaluate}
      battery: {code: ER, requirement: evaluate}
      fluid_component: {code: ER, requirement: evaluate}
      pressure_vessel: {code: ER, requirement: evaluate}
