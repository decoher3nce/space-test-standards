      solar_array: {code: "--", requirement: not_required}
      battery: {code: R, requirement: required}
      fluid_component: {code: R, requirement: required}
      pressure_vessel: {code: R, requirement: required}
      thruster: {code: R, requirement: required}
      thermal: {code: R, requirement: required}
      optical: {code: R, requirement: required}
