# SSC-S-016 unit acceptance test table as reproduced on slide 6 (pdf page 7) of the public NESC
# Academy briefing "Introduction & Application of SSC-S-016: Thermal Environmental Testing"
# (J. W. Welch, June 2026). The standard itself is not held, so every code and footnote marker is
# exactly as the slide prints it and the whole record is deck_only until checked against the
# unit acceptance test table in SSC-S-016 section 6.3. The "Vibration or Acoustic" row is split
# into a random_vibration row (6.3.5) and an acoustic row (6.3.6) carrying the same cells.
kind: applicability_matrix
id: ssc-s-016.matrix.unit_acceptance
standard: ssc-s-016
title: Unit acceptance tests by hardware type (SSC-S-016 unit acceptance table, as shown in the NESC deck)
citation: {standard: ssc-s-016, clause: "6.3", table: "Unit Acceptance Tests - SSC-S-016 (deck slide 6)", page: "6", pdf_page: 7, note: "pdf_page indexes the 72-page NESC Academy deck, not the standard; row clauses are the slide's Reference paragraph column"}
regime: acceptance
level_of_assembly: unit
column_dimension: hardware_type
columns:
