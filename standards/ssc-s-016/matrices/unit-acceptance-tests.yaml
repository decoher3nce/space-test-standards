      antenna: {code: R, requirement: required, footnotes: [f1]}
      mechanism: {code: R, requirement: required, footnotes: [f1]}
      solar_array: {code: R, requirement: required, footnotes: [f1]}
      battery: {code: R, requirement: required, footnotes: [f1]}
      fluid_component: {code: R, requirement: required, footnotes: [f1]}
