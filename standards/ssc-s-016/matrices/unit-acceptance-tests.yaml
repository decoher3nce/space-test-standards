  - {id: antenna, label: Antenna}
  - {id: mechanism, label: MMA}
  - {id: solar_array, label: Solar Array (Panel)}
  - {id: battery, label: Battery (12), notes: Column heading carries footnote 12 (safety-device testing required for lithium-ion batteries)}
  - {id: fluid_component, label: Pressure Component}
  - {id: pressure_vessel, label: Pressure Vessel}
  - {id: thruster, label: Thruster}
  - {id: thermal, label: Thermal}
  - {id: optical, label: Optical}
  - {id: structure, label: Structural Components}
