kind: tailoring_provision
id: ssc-s-016.provision.dwell_reduction
standard: ssc-s-016
title: Reduced thermal dwell when data or analysis show the whole test article reaches temperature sooner
citation: {standard: ssc-s-016, clause: "6.3.8", table: "Proposed Tailoring - Thermal Dwell Times (deck slide 39)", page: "39", pdf_page: 40, note: "dwell requirement values on deck slide 37 (pdf 38)"}
summary: >
  The dwell requirement (1 hr thermal cycle; 2 hr first and last thermal vacuum cycle, 1 hr
  intermediate) exists so that internal locations, which lag the base-plate sensors, are at test
  temperature before functional testing starts. The briefing's position is to keep the
  requirement but allow a shorter dwell at unit or vehicle level when data or analysis demonstrate
  that significantly less time brings all areas of the test article to test temperature.
applies_to:
  test_types: [thermal_cycle, thermal_vacuum]
  levels: [unit, subsystem, element]
  regimes: [acceptance, protoflight, qualification]
permits:
  - action: reduce_duration
    description: Shorten the dwell at a temperature plateau before functional testing.
    constraints: Only with test data or thermal analysis showing all internal locations reach the test temperature in the shorter time; starting functional tests while parts are still transitioning is an under-test.
approval: Not stated in the deck
documentation: Data or analysis demonstrating the shorter time to temperature
confidence: deck_only
notes: This is the briefing's recommended response to a common tailoring request; verify whether SSC-S-016 6.3.8/6.3.9 or 4.10 allow it in these terms.
---
kind: tailoring_provision
id: ssc-s-016.provision.fewer_acceptance_cycles
standard: ssc-s-016
title: Fewer unit acceptance thermal cycles only with hardware-specific reliability data
citation: {standard: ssc-s-016, clause: "6.3.8", table: "Proposed Tailoring - Fewer Acceptance Thermal Cycles (deck slide 36)", page: "36", pdf_page: 37, note: "also deck slides 32-34 (pdf 33-35) for the test-effectiveness data"}
summary: >
  Requests to cut unit acceptance thermal cycling (eight cycles is often proposed) are answered by
  the data behind the baseline: 14 cycles over 85 degC give about 95 percent test effectiveness
  (2 sigma), 8 cycles about 85-88 percent, letting two to four more latent defects escape to
  integration and one to three to flight. The briefing's recommendation is to keep 14 cycles and
  reduce only where hardware-specific data show the needed reliability is reached with fewer;
  card or slice thermal preconditioning does not by itself satisfy the unit cycle requirement.
applies_to:
  test_types: [thermal_cycle, thermal_vacuum]
  levels: [unit]
  hardware_types: [electronic]
  regimes: [acceptance]
permits:
  - action: reduce_cycles
    description: Reduce the acceptance thermal cycle count below the 14-cycle baseline.
    constraints: Only when hardware-specific data demonstrate the required reliability with fewer cycles; a generic eight-cycle proposal is not accepted on test-effectiveness grounds.
approval: Not stated in the deck
documentation: Hardware-specific reliability data
confidence: deck_only
notes: Briefing's recommended position; verify the standard's own wording on cycle-count tailoring in SSC-S-016 6.3.8 and 4.10.
