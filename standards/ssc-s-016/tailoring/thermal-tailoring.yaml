kind: tailoring_provision
id: ssc-s-016.provision.vehicle_tc_option
standard: ssc-s-016
title: Optional vehicle thermal cycle test preceding thermal vacuum (Appendix A) with reduced thermal vacuum cycles
citation: {standard: ssc-s-016, clause: "Appendix A", table: "Subsystem and Vehicle Thermal Test Parameters (deck slide 69)", page: "69", pdf_page: 70, note: "also deck slide 60 (pdf 61)"}
summary: >
  A vehicle (or subsystem) thermal cycle test may be run before thermal vacuum as an option
  discussed in the standard's Appendix A. It adds screening with faster transitions, lets
  performance and procedure problems be resolved before the vacuum test, and reduces the required
  thermal vacuum cycles: 2 TV + 3 TC instead of 4 TV for acceptance and protoqualification, and
  4 TV + 6 TC instead of 8 TV for qualification. Thermal cycle and thermal vacuum remain
  non-interchangeable; the option costs test time and needs continuous temperature monitoring
  because transitions are faster than in vacuum.
applies_to:
  test_types: [thermal_vacuum, thermal_cycle]
  levels: [subsystem, element]
  regimes: [acceptance, protoflight, qualification]
permits:
  - action: alternate_cycle_plan
    description: Replace the thermal-vacuum-only plan with a combined plan of fewer thermal vacuum cycles plus ambient-pressure thermal cycles.
    constraints: Acceptance and protoqualification 2 TV + 3 TC (in place of 4 TV); qualification 4 TV + 6 TC (in place of 8 TV); thermal balance and first/last-cycle performance tests stay in the thermal vacuum part.
approval: Not stated in the deck
documentation: Not stated in the deck
confidence: deck_only
notes: Deck-sourced; verify against SSC-S-016 Appendix A and the vehicle thermal test table (section 8).
