# Unit thermal test rules of SSC-S-016 as described in the NESC Academy deck: burn-in hours,
# failure-free final cycles, thermal after vibration, and operation during the thermal profile.
kind: rule
id: ssc-s-016.rule.burn_in_hours
standard: ssc-s-016
title: Burn-in of 200 thermal test hours for acceptance and protoqualification electronic units
citation: {standard: ssc-s-016, clause: "6.3.8", table: "Other SSC-S-016 Thermal Test Requirements (deck slide 37)", page: "37", pdf_page: 38, note: "also deck slides 45 and 48 (pdf 46, 49); the deck does not name the burn-in clause, footnote 8 of the unit table says burn-in is required for electronic units"}
category: operating_hours
statement: >
  Acceptance and protoqualification electronic units accrue at least 200 hours of thermal test
  operation, counted across thermal cycling, thermal vacuum and elevated-temperature operation,
  with at least 100 hours on each redundant path. Hours short of the total are made up with extra
  thermal cycles (preferred for fatigue-driven defects) or dwell at the hot acceptance temperature
  (preferred for diffusion-driven defects). Operation at ambient temperature does not count
  because it gives little thermal stress. Qualification units have no separate burn-in
  requirement (enveloped).
applies_to:
  test_types: [burn_in, thermal_cycle, thermal_vacuum]
  levels: [unit]
  hardware_types: [electronic]
  regimes: [acceptance, protoflight]
values:
  total_thermal_test_hours: {value: 200, unit: hr}
  hours_per_redundant_path: {value: 100, unit: hr}
  ambient_hours_credit: {value: 0, unit: hr, note: "ambient operation is not credited toward burn-in"}
confidence: deck_only
notes: >
  Deck-sourced; verify against the SSC-S-016 burn-in requirement (clause not named in the deck).
  The 2026 revision reduces the total to 150 hr (175 hr for internally redundant units); see
  ssc-s-016-2026.rule.burn_in_hours.
