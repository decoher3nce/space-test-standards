kind: rule
id: ssc-s-016.rule.vehicle_thermal_vacuum_performance_tests
standard: ssc-s-016
title: Vehicle thermal vacuum profile, performance testing and thermal zones
citation: {standard: ssc-s-016, clause: "8", table: "Vehicle Thermal Vacuum (TV) Testing (deck slide 57)", page: "57", pdf_page: 58, note: "also deck slides 61, 63 and 64 (pdf 62, 64, 65); SSC-S-016 vehicle test requirements are in section 8 (verify)"}
category: functional_test
statement: >
  Vehicle thermal vacuum runs four cycles for acceptance and protoqualification vehicles with
  specification performance tests hot and cold on the first and last cycle and the vehicle powered
  and monitored (trending, anomaly detection) during intermediate cycles and transitions. The
  temperature range is worst-case predictions plus the regime margin, with no default screening
  range; the vehicle is divided into thermal zones and performance testing in a zone starts when
  its first unit reaches the goal temperature. The test demonstrates mission performance and is
  not intended to screen units. The deck notes that programs sometimes waive full performance
  testing on the first cycle and recommends against it because trending from pre-test ambient to
  first and last vacuum cycle is lost.
applies_to:
  test_types: [thermal_vacuum]
  levels: [element]
  regimes: [acceptance, protoflight]
values:
  tv_cycles: {value: 4, unit: cycles}
  specification_performance_cycles: {text: "First and last cycle, hot and cold", unit: text}
confidence: deck_only
notes: Deck-sourced; verify against the SSC-S-016 vehicle thermal vacuum clause (section 8).
---
kind: rule
id: ssc-s-016.rule.thermal_balance_phases
standard: ssc-s-016
title: Vehicle thermal balance during the first thermal vacuum cycle with at least three phases
citation: {standard: ssc-s-016, clause: "8", table: "Rationale for Thermal Balance Test Approach (deck slide 67)", page: "67", pdf_page: 68, note: "also deck slide 68 (pdf 69); SSC-S-016 vehicle thermal balance clause is in section 8 (verify)"}
category: general
statement: >
  Thermal balance for thermal model correlation is specified during the first cycle of the first
  vehicle thermal vacuum test, so thermal subsystem problems can be fixed before the rest of the
  vacuum test and analysts have the remaining test time for correlation. At least three phases are
  needed: hot operational, cold operational and cold non-operational (the third gives a further
  correlation point and verifies survival and heater design); safe-mode and transient cool-down
  phases are optional. Hardware not designed to reach steady state is correlated on temperature
  change and rate of change instead of steady-state temperatures.
applies_to:
  test_types: [thermal_balance, thermal_vacuum]
  levels: [subsystem, element]
values:
  minimum_phases: {value: 3, unit: count, note: "hot operational, cold operational, cold non-operational"}
  minimum_operational_correlation_points: {value: 2, unit: count, note: "approximate thermal extremes"}
confidence: deck_only
notes: Deck-sourced; verify against the SSC-S-016 vehicle thermal balance clause (section 8).
