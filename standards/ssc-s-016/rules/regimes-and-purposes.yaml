# Test regimes, thermal test purposes and model philosophy of SSC-S-016 as explained in the NESC
# Academy deck (slides 14-16, 41, 53, 56, 57, 63, 67, 68; pdf 15-17, 42, 54, 57, 58, 64, 68, 69).
kind: rule
id: ssc-s-016.rule.regime_definitions
standard: ssc-s-016
title: Acceptance, qualification, protoqualification and development test regimes
citation: {standard: ssc-s-016, clause: "4", table: "Test Levels (deck slide 14)", page: "14", pdf_page: 15, note: "the deck does not give the definitions clause; SSC-S-016 section 3 (definitions) and 4 (general) are the places to verify"}
category: model_philosophy
statement: >
  Acceptance testing demonstrates the acceptability of each deliverable item, with the emphasis on
  workmanship and flight-worthiness. Qualification testing demonstrates the design, the
  manufacturing process and the acceptance program, at conditions more severe than flight, on
  non-flight hardware and before acceptance testing. Protoqualification (also called protoqual or
  flight-proof) is reduced qualification testing of flight hardware to save the cost and schedule
  of a dedicated qualification article; its thermal environment lies between acceptance and
  qualification. Development tests are engineering tests for design information, typically before
  formal qualification and unit-level testing.
applies_to:
  regimes: [acceptance, protoflight, qualification, development]
confidence: deck_only
notes: Deck-sourced paraphrase; verify against the SSC-S-016 definitions and test-strategy clauses.
