id: ssc-s-016.rule.subsystem_payload_thermal_vacuum_applicability
standard: ssc-s-016
title: Subsystem-level thermal vacuum applicability for structure, bus and payload
citation: {standard: ssc-s-016, clause: "7", table: "Subsystem/Payload Thermal Testing (deck slide 56)", page: "56", pdf_page: 57, note: "deck gives no clause; SSC-S-016 subsystem test requirements are in section 7 (verify)"}
category: general
statement: >
  SSC-S-016 thermal requirements for subsystems and payloads are thermal vacuum only, intended to
  move vehicle-level verifications to a level where they can be better demonstrated. The deck's
  table: for qualification and protoqualification hardware, thermal vacuum is evaluation-required
  for structure and bus subsystems and required for payloads; for acceptance hardware it is not
  required for structure, evaluation-required for bus and required for payloads.
