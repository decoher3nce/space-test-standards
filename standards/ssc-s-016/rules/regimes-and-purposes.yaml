kind: rule
id: ssc-s-016.rule.tc_tv_perceptiveness
standard: ssc-s-016
title: Thermal cycle and thermal vacuum are not interchangeable (perceptiveness by failure mechanism)
citation: {standard: ssc-s-016, clause: "6.3.8", table: "Thermal Test Purposes (deck slide 16)", page: "16", pdf_page: 17, note: "also deck slide 60 (pdf 61) for the same point at vehicle level"}
category: general
statement: >
  The deck's perceptiveness table shows why thermal cycling and thermal vacuum have different
  physics of failure and objectives and cannot replace one another: thermal vacuum is very
  perceptive to flight-like performance and perceptive to thermal balance, arcing, multipaction
  and corona, and outgassing, where thermal cycling is not perceptive; thermal cycling is very
  perceptive to thermal stress effects where thermal vacuum is only perceptive; both are
  perceptive to latent defects and failure propagation, hardware and integration faults, and
  electrical intermittences.
applies_to:
  test_types: [thermal_cycle, thermal_vacuum]
values:
  flight_like_performance_tc: {text: Not perceptive, unit: text}
  flight_like_performance_tv: {text: Very perceptive, unit: text}
  thermal_control_balance_tc: {text: Not perceptive, unit: text}
  thermal_control_balance_tv: {text: Perceptive, unit: text}
  arcing_tc: {text: Not perceptive, unit: text}
  arcing_tv: {text: Perceptive, unit: text}
  multipaction_corona_tc: {text: Not perceptive, unit: text}
  multipaction_corona_tv: {text: Perceptive, unit: text}
  material_outgassing_tc: {text: Not perceptive, unit: text}
  material_outgassing_tv: {text: Perceptive, unit: text}
  latent_defects_failure_propagation_tc: {text: Perceptive, unit: text}
  latent_defects_failure_propagation_tv: {text: Perceptive, unit: text}
  thermal_stress_effects_tc: {text: Very perceptive, unit: text}
  thermal_stress_effects_tv: {text: Perceptive, unit: text}
  hardware_and_integration_tc: {text: Perceptive, unit: text}
  hardware_and_integration_tv: {text: Perceptive, unit: text}
  electrical_intermittences_tc: {text: Perceptive, unit: text}
  electrical_intermittences_tv: {text: Perceptive, unit: text}
confidence: deck_only
notes: >
  This is the briefing's rationale table, not text of the standard; it is kept because tailoring
  arguments that trade thermal vacuum against thermal cycling must address these mechanisms.
  Verify the standard's own wording in 6.3.8 and 6.3.9 and 4.10.2.
