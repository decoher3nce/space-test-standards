kind: rule
id: ssc-s-016.rule.thermal_test_objectives
standard: ssc-s-016
title: Objectives of thermal testing (screening, performance, turn-on, survival, model correlation)
citation: {standard: ssc-s-016, clause: "6.3.8", table: "Objectives of Thermal Testing (deck slides 12-13)", page: "12", pdf_page: 13, note: "deck slides 12 and 13 (pdf 13, 14); the standard's purpose statements are in the individual test clauses"}
category: general
statement: >
  Thermal tests serve five purposes: environmental stress screening, which forces latent defects
  into observable failures under stresses more severe than use so they can be repaired before
  flight; performance verification within specification in a flight-like environment; turn-on
  demonstration under severe, changing temperatures and gradients; survival demonstration at the
  most severe realistic temperatures, where the unit must turn on and show no degradation once
  back in its operating range; and thermal model correlation of test data against predictions.
applies_to:
  test_types: [thermal_cycle, burn_in, thermal_vacuum, thermal_balance]
confidence: deck_only
notes: Deck-sourced paraphrase; verify against the purpose paragraphs of SSC-S-016 6.3.8, 6.3.9 and the vehicle thermal clauses.
