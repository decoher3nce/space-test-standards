kind: rule
id: ssc-s-016.rule.thermal_tests_by_regime_and_level
standard: ssc-s-016
title: Which thermal tests each regime runs and at which level of assembly
citation: {standard: ssc-s-016, clause: "6.3", table: "Thermal Environmental Tests specified in SSC-S-016 (deck slide 15)", page: "15", pdf_page: 16, note: "also deck slide 41 (pdf 42) for the unit TC/BI/TV by regime table"}
category: model_philosophy
statement: >
  Thermal cycle (hot/cold cycling in air or GN2 with rapid transitions, purpose ESS) is the
  primary unit test and optional at subsystem and vehicle level; burn-in (continuation of thermal
  cycling, purpose ESS) is a unit test; thermal vacuum (realistic flight simulation, purpose
  performance verification and survival/turn-on) is the primary test at unit (vacuum-sensitive
  units), subsystem and vehicle level; thermal balance (flight simulation in vacuum, purpose
  thermal control verification and model correlation) is run on the vehicle and some subsystems.
  Qualification hardware receives thermal cycle, thermal vacuum and thermal balance but no
  burn-in; protoqualification hardware receives all four; acceptance hardware receives thermal
  cycle, burn-in and thermal vacuum but no thermal balance.
applies_to:
  test_types: [thermal_cycle, burn_in, thermal_vacuum, thermal_balance]
  levels: [unit, subsystem, element]
  regimes: [acceptance, protoflight, qualification]
