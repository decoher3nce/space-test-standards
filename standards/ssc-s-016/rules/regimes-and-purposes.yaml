kind: rule
id: ssc-s-016.rule.flightproof_not_for_thermal
standard: ssc-s-016
title: Flightproof strategy is not applicable to thermal environments; protoqualification cycle counts
citation: {standard: ssc-s-016, clause: "6.3.8", table: "Unit Thermal Test Parameter Requirements in SSC-S-016 (deck slide 53)", page: "53", pdf_page: 54, note: "also deck slide 63 (pdf 64) for the vehicle-level protoqualification cycle count"}
category: model_philosophy
statement: >
  A flightproof test strategy is not applicable for thermal environments. At unit level the
  protoqualification thermal cycle count (20 total) is closer to qualification (27) than to
  acceptance (14), reflecting more screening at the unit level; at vehicle level
  protoqualification uses the same four thermal vacuum cycles as acceptance because the emphasis
  there is hot/cold performance verification rather than screening.
applies_to:
  test_types: [thermal_cycle, thermal_vacuum]
  regimes: [protoflight]
values:
  unit_total_cycles_acceptance: {value: 14, unit: cycles}
  unit_total_cycles_protoqualification: {value: 20, unit: cycles}
  unit_total_cycles_qualification: {value: 27, unit: cycles}
  vehicle_tv_cycles_acceptance: {value: 4, unit: cycles}
  vehicle_tv_cycles_protoqualification: {value: 4, unit: cycles}
  vehicle_tv_cycles_qualification: {value: 8, unit: cycles}
confidence: deck_only
notes: Deck-sourced; verify against the SSC-S-016 test-strategy clauses (section 4) and the unit and vehicle thermal tables.
