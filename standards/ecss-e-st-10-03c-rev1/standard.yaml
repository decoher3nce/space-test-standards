scope: >
  Requirements for space segment equipment and element test programmes: test philosophy, model
  philosophy, qualification, acceptance and protoflight baselines (Tables 5-1 to 5-6 for equipment,
  6-1 to 6-6 for elements), test levels and durations, tolerances, and the tailoring approach in Annex D.
