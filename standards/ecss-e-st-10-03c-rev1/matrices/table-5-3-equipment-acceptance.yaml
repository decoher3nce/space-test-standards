legend:
  R: Required
  X: To be decided by the customer
  "-": Not required
footnotes:
  fft_solar_array_deployment: For solar arrays the deployment test is mandatory before and after the environmental tests, with a manual deployment beforehand
  burn_in_if_sequence_short: Performed when the acceptance sequence is too short to reveal material and workmanship defects that would appear in the equipment's lifetime
  cog_moi_by_calculation: With customer agreement, centre of gravity and moments of inertia may be calculated instead of measured
  pressure_vessel_proof_if_not_covered: A general structural proof test is performed on pressure vessels unless covered by a higher-level test such as sinusoidal vibration with full tanks
  random_or_acoustic_by_size: For antennas, optical equipment and mechanisms, random vibration or acoustic (or both, at qualification and protoflight) is chosen according to the type, size and location of the equipment
  solar_array_random_added_to_acoustic: For solar arrays fixed directly to the element side wall without an offset bracket, random vibration should be added to the acoustic test
  solar_array_recurrent_acoustic_omission: Acoustic acceptance of recurrent solar array FMs (from the second FM) can be omitted when they are acceptance tested at element level
  solar_array_recurrent_sine_omission: Sinusoidal acceptance of recurrent solar array FMs (from the second FM) can be omitted when they are acceptance tested at element level or have significant flight heritage in design, processes and manufacturer
  microvib_emission_if_source: Performed when the customer requires it because the equipment may generate micro-vibrations that degrade the mission
  microvib_susceptibility_if_sensitive: Performed when the equipment's function or performance may be degraded by micro-vibrations
  electronic_sealed_or_pressurized_only: For electronic, electrical and RF equipment this test is required only when the equipment is sealed or pressurised
  battery_proof_at_cell_level: For batteries, proof pressure is performed at cell (component) level
  mission_pressure_applicability: Mission-pressure cycling without vacuum cycling applies only to equipment operating in a non-vacuum environment for its whole life; consider depressurisation failure when deciding
  mission_pressure_combination: Mission-pressure cycling and vacuum cycling may be combined
  no_room_pressure_cycling: Room-pressure temperature cycling (US-style thermal cycling, ECSS-E-ST-10-03A) is not part of this standard
  battery_not_rechargeable: Not required for batteries that cannot be recharged after the test
  emc_bonding_only_without_electronics: For equipment without electronics the EMC test reduces to a bonding test
  magnetic_if_mission_needs: Performed when justified by mission needs, in line with the EMC control plan
  multipactor_fm_or_batch: May be performed on the flight model or on a batch of RF components
  corona_applicability: Applicability conditions are given in clause 5.5.5.6 (exposure to the critical low-pressure range)
  audible_noise_crewed_only: Required only for equipment of crewed space segment elements
notes: >
  Rows follow the printed order and section headings. Requirement mirrors the printed code; gating
  application notes are carried in footnotes and `condition`. Rows printed with "-" in every column
  (humidity, life, spin, sine burst, shock, pressure cycling, design burst, burst, ESD) are kept so
  the acceptance baseline can be compared cell by cell with Tables 5-1 and 5-5. Column e "Fluid or
  propulsion equipment" is not a separate column because it shares fluid_component with column d
  (Valve); its printed codes equal column d in every row except Burn-in (e is "-"). Clause 4.5.3b:
  acceptance testing is performed on every flight product other than the protoflight model.
