# ECSS-E-ST-10-03C Rev.1 Table 6-3 "Space segment element - Acceptance test baseline" (FM after
# qualification on another model). Codes kept exactly as printed; conditions paraphrased.
kind: applicability_matrix
id: ecss-e-st-10-03c-rev1.matrix.element_acceptance
standard: ecss-e-st-10-03c-rev1
title: Space segment element acceptance test baseline (Table 6-3)
citation: {standard: ecss-e-st-10-03c-rev1, clause: "6.3", table: Table 6-3, page: "94", pdf_page: 94, note: "table spans pdf pages 94-96; key on pdf page 96"}
regime: acceptance
level_of_assembly: element
column_dimension: level_of_assembly
