legend:
  R: Mandatory
  X: To be decided on the basis of design features, required lifetime, sensitivity to environmental exposure and expected usage
  "-": Not required
footnotes:
  launcher_if_not_on_fm: Mandatory for elements that interface with the launcher when the test is not performed on the FM (Table 6-3)
  static_if_not_at_subsystem: Mandatory when a static test was not performed at structure subsystem level
  spin_above_2g: Mandatory for spinning elements when any part sees an acceleration of 2 g or more
  sine_burst_replaces_static: Can replace a static test
  acoustic_random_interchange: Acoustic may be replaced by random vibration; for a small compact element acoustic testing is not an adequate simulation and random may replace it; if acoustic is performed, random may be avoided
  sine_replaced_by_transient_modal: Sinusoidal vibration may be replaced by a transient test combined with a modal survey
  crewed_mandatory: Mandatory for crewed missions
  pressurized_if_feasible: Mandatory for pressurised elements, or for pressurised equipment integrated in the element, where the test is feasible
  pressure_cycling_reentries: Mandatory for pressurised elements that will undergo several re-entries
  burst_dedicated_hardware: Mandatory for pressurised elements; may be performed on dedicated hardware
  mission_pressure_applicability: Applicable to elements that operate in a non-vacuum environment during their life
  mission_pressure_combination: Mission-pressure cycling and vacuum cycling may be combined (in sequence at qualification)
  no_room_pressure_cycling: Room-pressure temperature cycling (US-style thermal cycling, ECSS-E-ST-10-03A) is not part of this standard
  atmospheric_entry_only: For elements performing atmospheric entry
  crewed_section: Listed under the crewed-mission-specific heading; applies to crewed elements
notes: >
  Column dimension is level_of_assembly with the single column `element`: Tables 6-1, 6-3 and 6-5
  have one applicability column for the whole space segment element (no hardware-type split), with
  an "Applicability Conditions" column that is carried here in `condition` and footnotes.
  Requirement mirrors the printed code; conditions that make an X mandatory or restrict an R are
  not folded into the requirement. Rows under the "Crewed Mission Specific" heading print R and
  apply to crewed elements. Element-only tests without a unified id are encoded as variants of the
  closest id (see VOCAB-REQUESTS.md).
  
  Clause 6.2a: this baseline applies when a full qualification model of the element is built; other
  special tests may be added for project characteristics and product life cycle.
