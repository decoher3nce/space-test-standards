  chamber_pressure_below_1p3e-3_hpa: {min_value: -80, max_value: 80, unit: percent, note: "below 1.3e-3 hPa"}
  steady_acceleration_and_static_load: {min_value: 0, max_value: 10, unit: percent, note: "-0 / +10 %"}
