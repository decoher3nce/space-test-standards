kind: rule
id: ecss-e-st-10-03c-rev1.rule.test_input_tolerances
standard: ecss-e-st-10-03c-rev1
title: Allowable test input tolerances (Table 4-1)
citation: {standard: ecss-e-st-10-03c-rev1, clause: "4.4.2", table: Table 4-1, page: "32", pdf_page: 32, note: "table spans pdf pages 32-33"}
category: tolerance
statement: >
  Bands within which the measured test inputs may deviate from the specified test values. Tolerance
  bands are agreed with the customer and written into the test specification; they must account
  for the uncertainty budget and confidence level of the instruments that control and monitor the
  test (4.4.2a-b). Measured demonstrations of quantitative requirements are compared with the
  specified values including their uncertainties (4.4.2c). Temperature bands apply above 80 K at
  equipment level only; element-level temperature targets are in Tables 6-2, 6-4 and 6-6.
values:
  temperature_low_above_80k: {min_value: -4, max_value: 0, unit: K, note: "Tmin +0/-4 K, equipment level, above 80 K"}
  temperature_high_above_80k: {min_value: 0, max_value: 4, unit: K, note: "Tmax -0/+4 K, equipment level, above 80 K"}
  temperature_below_80k: {text: To be defined case by case, unit: text}
  relative_humidity: {min_value: -10, max_value: 10, unit: percent}
  chamber_pressure_above_1p3_hpa: {min_value: -15, max_value: 15, unit: percent, note: "vacuum chamber pressure above 1.3 hPa"}
