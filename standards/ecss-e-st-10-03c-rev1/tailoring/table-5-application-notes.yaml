# Relaxations written into the application notes of Tables 5-1, 5-3 and 5-5 and the notes of
# Tables 5-2, 5-4 and 5-6 (space segment equipment).
kind: tailoring_provision
id: ecss-e-st-10-03c-rev1.provision.equipment_strength_test_selection
standard: ecss-e-st-10-03c-rev1
title: One strength test (static, spin or sine burst) only when sinusoidal vibration does not cover it
citation: {standard: ecss-e-st-10-03c-rev1, clause: "5.5.2.2", table: Table 5-1, page: "46", pdf_page: 46, note: "also Table 5-3 (pdf 55) and Table 5-5 (pdf 62)"}
summary: >
  At qualification, static load, spin and sine burst are X for every equipment type except solar
  panels, and only one of the three is performed, and only if the strength case is not already
  covered by the sinusoidal vibration test. At protoflight the choice is between spin and sine
  burst (static load is "-"). At acceptance all three are "-" except a general structural proof
  test on pressure vessels when no higher-level test (such as sinusoidal vibration with full
  tanks) covers it.
applies_to:
  test_types: [static_load, spin, sine_burst]
  levels: [unit]
  regimes: [qualification, protoflight, acceptance]
permits:
  - action: delete_test
    description: Omit the dedicated strength test when the sinusoidal vibration test already demonstrates the limit-load strength case.
  - action: substitute_test
    description: Choose one of static load, spin or sine burst (qualification) or spin or sine burst (protoflight) as the strength demonstration.
  - action: change_level_of_assembly
    description: At acceptance, cover the pressure-vessel structural proof by a higher-level test instead of a dedicated static test.
approval: Customer (X-coded tests)
---
kind: tailoring_provision
id: ecss-e-st-10-03c-rev1.provision.equipment_random_or_acoustic_selection
standard: ecss-e-st-10-03c-rev1
title: Random vibration, acoustic or both chosen by equipment type, size and location
citation: {standard: ecss-e-st-10-03c-rev1, clause: "5.5.2.3", table: Table 5-1, page: "46", pdf_page: 46, note: "also Table 5-3 (pdf 55) and Table 5-5 (pdf 62)"}
summary: >
  For antennas, optical equipment and mechanisms the application notes let the programme select
  random vibration, acoustic, or (at qualification and protoflight) both, according to the type,
  size and mounting location of the equipment. Solar arrays fixed directly to the element side wall
  without an offset bracket should add random vibration to their acoustic test.
applies_to:
  test_types: [random_vibration, acoustic]
  levels: [unit]
  hardware_types: [antenna, optical, mechanism, solar_array]
permits:
  - action: substitute_test
    description: Replace random vibration by acoustic (or the reverse) for antennas, optical equipment and mechanisms when the type, size and location make the other environment the relevant one.
  - action: combine_tests
    description: Perform both random vibration and acoustic where each covers part of the equipment response; add random vibration to the acoustic test for wall-mounted solar arrays without offset brackets.
approval: Customer (X-coded cells)
---
kind: tailoring_provision
id: ecss-e-st-10-03c-rev1.provision.equipment_shock_omission
standard: ecss-e-st-10-03c-rev1
title: Shock test omitted when the equipment is shown to withstand more than the shock environment
citation: {standard: ecss-e-st-10-03c-rev1, clause: "5.5.2.6", table: Table 5-1, page: "46", pdf_page: 46, note: "also Table 5-5 (pdf 62)"}
summary: >
  The shock test need not be performed when it is demonstrated that the equipment's shock
  susceptibility lies above the shock environment. Solar array shock qualification is done at
  component level and confirmed during the deployment test. Element-level firing of the real shock
  device is run without margin to consolidate the equipment shock specification (Table 5-2 note 1).
applies_to:
  test_types: [shock]
  levels: [unit]
  regimes: [qualification, protoflight]
permits:
  - action: delete_test
    description: Omit the equipment shock test on demonstration that the equipment tolerates levels above the specified shock environment.
    constraints: Demonstration required; the standard does not name the method.
  - action: change_level_of_assembly
    description: For solar arrays, qualify shock at component level and confirm it during the deployment test.
approval: Customer
---
kind: tailoring_provision
id: ecss-e-st-10-03c-rev1.provision.cog_moi_by_calculation
standard: ecss-e-st-10-03c-rev1
title: Centre of gravity and moments of inertia calculated instead of measured
citation: {standard: ecss-e-st-10-03c-rev1, clause: "5.5.2.1", table: Table 5-1, page: "46", pdf_page: 46, note: "also Table 5-3 (pdf 55), Table 5-5 (pdf 62) and Table 6-3 (pdf 94)"}
summary: >
  Physical properties are required for every equipment type and element, but with customer
  agreement the centre of gravity and moments of inertia of equipment may be calculated rather than
  measured; at element acceptance the moment-of-inertia measurement may be deleted with customer
  approval (Table 6-3).
applies_to:
  test_types: [physical_properties]
  levels: [unit, element]
permits:
  - action: use_analysis
    description: Calculate equipment centre of gravity and moments of inertia instead of measuring them; mass is still measured.
  - action: delete_test
    description: Delete the moment-of-inertia measurement at element acceptance.
approval: Customer agreement (equipment); customer approval (element acceptance)
