kind: tailoring_provision
id: ecss-e-st-10-03c-rev1.provision.thermal_vacuum_and_mission_pressure_combination
standard: ecss-e-st-10-03c-rev1
title: Vacuum and mission-pressure temperature cycles combined and split by mission profile
citation: {standard: ecss-e-st-10-03c-rev1, clause: "5.5.4.1", table: Table 5-2, page: "52", pdf_page: 52, note: "Table 5-2 No 15-16, Table 5-4 No 7-8 (pdf 58-60), Table 5-6 No 11-12 (pdf 67); Table 6-2/6-4/6-6 No 14-15"}
summary: >
  Equipment or elements that operate in a non-vacuum environment after exposure to vacuum undergo
  both the thermal vacuum test and the thermal test at mission pressure (5.5.4.1a), which may be
  combined in sequence. The vacuum test then needs only one or more cycles, and the mission-pressure
  test takes the baseline count (8 at equipment qualification, 4 at equipment acceptance and
  protoflight, 4 and 3 at element level) minus the cycles already run in vacuum; the split and the
  operating conditions follow the mission profile. Mission-pressure cycling alone applies only to
  items that never see vacuum in their life, with depressurisation failure considered. Room-pressure
  thermal cycling in the US sense is not part of this standard.
applies_to:
  test_types: [thermal_vacuum, thermal_cycle]
  levels: [unit, element]
permits:
  - action: combine_tests
    description: Run the vacuum temperature cycling and the mission-pressure temperature cycling as one combined sequence.
  - action: reduce_cycles
    description: Reduce thermal vacuum to one or more cycles when combined, and run the mission-pressure test for the baseline count minus the vacuum cycles performed.
    constraints: Total cycle count across the two tests stays at the tabulated baseline; the split follows the mission profile.
approval: Customer (through the tailored levels table)
---
kind: tailoring_provision
id: ecss-e-st-10-03c-rev1.provision.solar_panel_acceptance_cycles
standard: ecss-e-st-10-03c-rev1
title: Solar panel acceptance thermal cycles adjusted for heritage and recurrence
citation: {standard: ecss-e-st-10-03c-rev1, clause: "5.5.4.2", table: Table 5-4, page: "59", pdf_page: 59, note: "Table 5-4 No 7 note 3"}
summary: >
  The solar panel thermal vacuum acceptance baseline is 5 cycles with plateaus of at least 1 hour at
  the hot and cold extremes. Without flight heritage of the panel design, process or manufacturer,
  or when qualification was done on a single panel (acceptance of a second panel), 10 cycles are
  run; with significant heritage in design, processes and manufacturer the count may drop to 3
  cycles with 30-minute plateaus; after the fifth recurrent panel accepted, 5 cycles with 30-minute
  plateaus apply.
applies_to:
  test_types: [thermal_vacuum]
  levels: [unit]
  hardware_types: [solar_panel]
  regimes: [acceptance]
permits:
  - action: reduce_cycles
    description: Reduce to 3 cycles with plateaus of at least 30 minutes given significant flight heritage of design, processes and manufacturer.
  - action: increase_cycles
    description: Increase to 10 cycles with plateaus of at least 1 hour when heritage is lacking or qualification used one panel only.
  - action: reduce_duration
    description: After the fifth recurrent panel, keep 5 cycles but shorten the plateaus to 30 minutes.
approval: As tabulated; heritage claims are the supplier's to justify to the customer
---
kind: tailoring_provision
id: ecss-e-st-10-03c-rev1.provision.solar_array_recurrent_fm_omissions
standard: ecss-e-st-10-03c-rev1
title: Recurrent solar array FMs may skip acoustic and sinusoidal acceptance when tested at element level
citation: {standard: ecss-e-st-10-03c-rev1, clause: "5.5.2.4", table: Table 5-3, page: "55", pdf_page: 55}
summary: >
  For solar arrays, acoustic acceptance testing of recurrent flight models (from the second FM) can
  be omitted when they are acceptance tested at space segment element level; sinusoidal vibration
  acceptance of recurrent FMs can likewise be omitted given element-level acceptance testing or
  significant flight heritage in design, processes and manufacturer.
applies_to:
  test_types: [acoustic, sine_vibration]
  levels: [unit]
  hardware_types: [solar_array]
  regimes: [acceptance]
permits:
  - action: change_level_of_assembly
    description: Cover acoustic and sinusoidal acceptance of recurrent solar array FMs by the element-level acceptance test.
  - action: delete_test
    description: Omit sinusoidal acceptance of recurrent solar array FMs on significant flight heritage.
    constraints: From the second FM onward only; the first FM is tested.
approval: Customer
