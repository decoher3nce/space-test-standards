# Relaxations written into the applicability conditions of Tables 6-1, 6-3 and 6-5 and clauses
# 6.1 and 6.4 (space segment element).
kind: tailoring_provision
id: ecss-e-st-10-03c-rev1.provision.element_mechanical_test_substitutions
standard: ecss-e-st-10-03c-rev1
title: Element mechanical tests substituted for one another
citation: {standard: ecss-e-st-10-03c-rev1, clause: "6.2", table: Table 6-1, page: "87", pdf_page: 87, note: "also Table 6-3 (pdf 94) and Table 6-5 (pdf 101)"}
summary: >
  At element level the applicability conditions allow several substitutions: acoustic may be
  replaced by random vibration (for a small compact element acoustic is not an adequate simulation),
  and when acoustic is performed random vibration may be avoided; sinusoidal vibration may be
  replaced by a transient test combined with a modal survey; sine burst can replace a static test;
  at acceptance sinusoidal vibration is not needed if acoustic or random is performed, and shock is
  limited to appendage deployment and to a launcher interface changed since the PFM or QM.
applies_to:
  test_types: [acoustic, random_vibration, sine_vibration, sine_burst, static_load, modal_survey, shock]
  levels: [element]
permits:
  - action: substitute_test
    description: Replace acoustic by random vibration for small compact elements, or skip random vibration when acoustic is performed.
  - action: substitute_test
    description: Replace sinusoidal vibration by a transient test combined with a modal survey.
  - action: substitute_test
    description: Replace the static test by a sine burst test; the static test is mandatory only when not done at structure subsystem level.
  - action: delete_test
    description: At acceptance, omit sinusoidal vibration when acoustic or random vibration is performed, and limit shock to appendage deployment and changed launcher interfaces.
approval: Customer (X-coded tests)
