    cycles: {value: 4, unit: cycles, note: or 1 or more when combined with cycles at mission pressure}
    actuations: {value: 1, unit: count, note: 1 test}
    extra:
      solar_panel_cycles: {value: 5, unit: cycles, note: "solar panels, baseline"}
      solar_panel_plateau: {value: 1, unit: hr, per: plateau, note: "minimum at hot and cold extremes, solar panels, baseline"}
      solar_panel_cycles_no_heritage: {value: 10, unit: cycles, note: "panel design, process or manufacturer without flight heritage, plateau 1 h minimum"}
      solar_panel_cycles_single_panel_qualification: {value: 10, unit: cycles, note: "when qualification used one panel only, acceptance of a second panel, plateau 1 h minimum"}
      solar_panel_cycles_significant_heritage: {value: 3, unit: cycles, note: "significant heritage in design, processes and manufacturer, plateau 30 min minimum"}
      solar_panel_cycles_after_fifth_recurrent: {value: 5, unit: cycles, note: "after the fifth recurrent panel accepted, plateau 30 min"}
    footnotes: [margin_extremes_a, combined_with_mission_pressure, cycles_by_mission_profile]
    notes: Table 5-4 No 7
  protoflight:
    margin: {value: 5, unit: degC, relative_to: acceptance_level, note: "TQ max = TA max + 5 degC and TQ min = TA min - 5 degC, operating and non-operating"}
    cycles: {value: 4, unit: cycles, note: or 1 or more when combined with cycles at mission pressure}
    actuations: {value: 1, unit: count, note: 1 test}
    extra:
      solar_panel_cycles: {value: 10, unit: cycles, note: solar panels}
      solar_panel_plateau: {value: 2, unit: hr, per: plateau, note: "minimum at hot and cold extremes, solar panels"}
