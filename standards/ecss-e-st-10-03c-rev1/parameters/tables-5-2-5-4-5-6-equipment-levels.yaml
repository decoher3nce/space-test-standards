footnotes:
  margin_extremes_q: A qualification margin smaller than 5 degC may be used below -170 degC and a larger one above 120 degC
  margin_extremes_a: An acceptance margin smaller than 5 degC may be used below -170 degC and a larger one above 120 degC
  combined_with_mission_pressure: Equipment that operates in a non-vacuum environment after exposure to vacuum undergoes both vacuum cycling and mission-pressure cycling
  cycles_by_mission_profile: The split of cycles and operating conditions between vacuum and mission pressure follows the mission profile
notes: >
