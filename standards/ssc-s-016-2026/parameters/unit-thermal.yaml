kind: test_parameters
id: ssc-s-016-2026.params.burn_in_unit
standard: ssc-s-016-2026
test_type: burn_in
title: Unit burn-in operating hours for electronic units (2026 revision - 150 hr, 175 hr if internally redundant)
citation: {standard: ssc-s-016-2026, clause: "6.3.8", table: "Other SSC-S-016 Thermal Test Requirements (deck slide 37)", page: "37", pdf_page: 38, note: "also deck slides 31, 45 and 46 (pdf 32, 46, 47); the burn-in clause number is not given in the deck"}
level_of_assembly: [unit]
hardware_type: [electronic]
by_regime:
  acceptance:
    duration: {min_value: 150, max_value: 175, unit: hr, note: "total thermal test operating time; the value depends on internal redundancy"}
    extra:
      non_internally_redundant_hours: {value: 150, unit: hr}
      internally_redundant_hours: {value: 175, unit: hr}
    footnotes: [n_basis]
  protoflight:
    duration: {min_value: 150, max_value: 175, unit: hr, note: "total thermal test operating time; the value depends on internal redundancy"}
    extra:
      non_internally_redundant_hours: {value: 150, unit: hr}
      internally_redundant_hours: {value: 175, unit: hr}
    footnotes: [n_basis]
  qualification:
    duration: {text: Enveloped, unit: text, note: "as in the 2014 edition; no separate burn-in requirement reported for qualification units"}
footnotes:
  n_basis: >
    The deck cites the Lockheed Martin burn-in study (Smith, IES 1988) as supporting the reduction
    from 300 hr (MIL-STD-1540A/B) to 200 hr and now to 150-175 hr, and notes a 14-cycle unit
    thermal vacuum test typically accrues the hours without added cycling. Whether the 100 hr per
    redundant path rule of the 2014 edition is retained is not stated.
confidence: deck_only
notes: Deck-sourced delta; verify against TR-2025-00777 / SSC-S-016 (2026) burn-in requirement, including how "internally redundant" is defined.
