# 320-MAR-1001 Rev. D, Appendix 6 tailoring codes for Section 9 (System Performance Verification)
# and its DIDs 9-1 to 9-6, with the paragraph and DID content paraphrased from Appendix 1
# (Section 9 body, pdf page 18), Appendix 3 (DID sheets, pdf pages 68-73) and Appendix 5 (DID
# delivery table, pdf page 105). Appendix 6 Section 9 rows are on pdf page 110. One rule per
# paragraph and per DID, plus one for the Appendix 6 scheme and one for the GEVS delegation.
kind: rule
id: gsfc-320-mar-1001d.rule.appendix_6_tailoring_scheme
standard: gsfc-320-mar-1001d
title: Appendix 6 tailoring table - per-class A/T/R codes against a Class B baseline
citation: {standard: gsfc-320-mar-1001d, clause: "1", table: "Appendix 6 Tailoring Table", page: "107/114", pdf_page: 107, note: "baseline statement in section 1 Applicability and 3.1 (pdf page 4); table runs pdf pages 107-112"}
category: general
statement: >
  The MAR's baseline narrative (Appendix 1) and DIDs (Appendix 3) are written to meet a Class B
  out-of-house mission. Appendix 6 lists every MAR paragraph and DID with one code per mission
  class A, B, C and D: A means applicable as written with no tailoring expected, T means tailoring
  is expected based on project-specific requirements, and R means tailoring is required based on
  project-specific requirements. The Chief Safety and Mission Assurance Officer tailors the
  appendices for Class A, C or D projects using this table. The table's header characterises the
  classes by example missions, priority and acceptable risk, national significance, complexity,
  primary mission lifetime and cost.
values:
  code_a: {text: A, unit: text, note: "applicable as written; no tailoring expected"}
  code_t: {text: T, unit: text, note: "tailoring expected based on project-specific requirements"}
  code_r: {text: R, unit: text, note: "tailoring required based on project-specific requirements"}
  baseline_class: {text: B, unit: text, note: "Appendices 1 to 4 are written for a Class B out-of-house mission"}
  class_a_risk: {text: "High priority, very low (minimized) risk", unit: text}
  class_b_risk: {text: "High priority, low risk", unit: text}
  class_c_risk: {text: "Medium priority, medium risk", unit: text}
  class_d_risk: {text: "Low priority, high risk", unit: text}
  class_a_lifetime: {text: "Long, more than 5 years", unit: text}
  class_b_lifetime: {text: "Medium, 2 to 5 years", unit: text}
  class_c_lifetime: {text: Short, unit: text}
  class_d_lifetime: {text: "Short, less than 2 years", unit: text}
confidence: verified
notes: >
  Legend as printed at the head of each Appendix 6 page. Example missions named in the table
  (TDRS and JWST for A, SDO and STEREO for B, MAP for C, FAST and IBEX for D) are given for
  orientation only.
---
kind: rule
id: gsfc-320-mar-1001d.rule.section_9_gevs_delegation
standard: gsfc-320-mar-1001d
title: Section 9 delegates verification and environmental test requirements to GSFC-STD-7000 (GEVS)
citation: {standard: gsfc-320-mar-1001d, clause: "9.1", page: "18/114", pdf_page: 18, note: "DID sheets 9-1 to 9-6 on pdf pages 68-73 each list GSFC-STD-7000 as the reference document"}
category: general
statement: >
  Section 9 does not set environmental test levels or durations of its own. Paragraph 9.1
  requires the developer to plan and implement the system performance verification program per
  the requirements of GSFC-STD-7000, the General Environmental Verification Standard (GEVS) for
  GSFC flight programs and projects, and every Section 9 DID names GSFC-STD-7000 as its reference
  document and points to a GEVS paragraph for preparation: the verification plan to GEVS 2.1.1.1,
  the environmental verification plan to 2.1.1.1.1, the verification matrix to 2.1.1.2, the
  environmental test matrix to 2.1.1.2.1 (example in GEVS Figure 2.1-1), verification reports to
  2.1.1.5 and the system performance verification report to 2.1.1.6. Test requirements for a MAR
  program are therefore read from the GEVS edition the contract cites (gevs-7000b in this library).
values:
  referenced_standard: {text: GSFC-STD-7000, unit: text, note: "General Environmental Verification Standard (GEVS); edition not stated in Rev. D"}
  gevs_paragraph_verification_plan: {text: "2.1.1.1", unit: text}
  gevs_paragraph_environmental_verification_plan: {text: "2.1.1.1.1", unit: text}
  gevs_paragraph_verification_matrix: {text: "2.1.1.2", unit: text}
  gevs_paragraph_environmental_test_matrix: {text: "2.1.1.2.1", unit: text}
  gevs_paragraph_verification_reports: {text: "2.1.1.5", unit: text}
  gevs_paragraph_system_performance_verification_report: {text: "2.1.1.6", unit: text}
confidence: verified
notes: The MAR cites GSFC-STD-7000 without a revision letter; confirm the GEVS edition on the contract before applying gevs-7000b records.
---
