id: gevs-7000b.params.sine_vibration
standard: gevs-7000b
test_type: sine_vibration
title: Sine vibration level and sweep rate (Table 2.2-2)
citation: {standard: gevs-7000b, clause: "2.2.4", table: Table 2.2-2, page: "2.2 - 5", pdf_page: 46}
by_regime:
  qualification:
    level: {value: 1.25, unit: factor, relative_to: limit_level}
    sweep_rate: {value: 2, unit: oct_per_min}
    footnotes: [f3]
  protoflight:
    level: {value: 1.25, unit: factor, relative_to: limit_level}
    sweep_rate: {value: 4, unit: oct_per_min}
    footnotes: [f3]
  acceptance:
    level: {value: 1.0, unit: factor, relative_to: limit_level}
    sweep_rate: {value: 4, unit: oct_per_min}
    footnotes: [f3]
footnotes:
  f3: >
    Choose the sweep direction to minimise risk to the hardware. If the sweep satisfies a loads
    requirement rather than simulating an oscillatory mission environment, a faster rate (for
    example 6 to 8 oct/min) may be considered to reduce over-stress.
