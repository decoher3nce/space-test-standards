# GEVS Table 2.2-2 "Test Factors/Durations" encoded one record per row. Each record is a
# separate YAML document in this file so the whole table stays together.
kind: test_parameters
id: gevs-7000b.params.static_load
standard: gevs-7000b
test_type: static_load
variant: centrifuge_or_static_load
title: Structural loads by centrifuge or static load (Table 2.2-2)
citation: {standard: gevs-7000b, clause: "2.2.4", table: Table 2.2-2, page: "2.2 - 5", pdf_page: 46}
by_regime:
  qualification:
    level: {value: 1.25, unit: factor, relative_to: limit_load}
    duration: {value: 1, unit: min}
    footnotes: [f1, f4]
  protoflight:
    level: {value: 1.25, unit: factor, relative_to: limit_load}
    duration: {value: 30, unit: s}
    footnotes: [f1, f4]
  acceptance:
    level: {value: 1.0, unit: factor, relative_to: limit_load}
    duration: {value: 30, unit: s}
    footnotes: [f1, f4]
footnotes:
  f1: >
    If qualified by analysis only, positive margins must be shown for factors of safety of 2.0 on
    yield and 2.6 on ultimate; beryllium and composite materials cannot be qualified by analysis
    alone. Weldments, beryllium, bonded and composite structure (including metal matrix) are tested
    to 1.25 x limit for both qualification and acceptance.
  f4: >
    Shorter durations may be used in static testing to protect hardware from facility-driven
    damage, provided the dwell demonstrates the target load within tolerance, all measurements are
    recorded, and the structure is stable under load.
---
