kind: rule
id: gevs-7000b.rule.factors_of_safety
standard: gevs-7000b
title: Design and analysis factors of safety applied to limit loads (Table 2.2-3)
citation: {standard: gevs-7000b, clause: "2.2.5", table: Table 2.2-3, page: "2.2 - 6", pdf_page: 47}
category: factor_of_safety
statement: >
  Minimum factors of safety on limit loads for flight hardware, by material class and load type
  (static, sine, random/acoustic). Random and acoustic factors apply to the statistically derived
  peak response (at least 3-sigma) and assume qualification or protoflight testing at acceptance
  level plus 3 dB. If qualified by analysis only, 2.0 on yield and 2.6 on ultimate apply.
  Pressurised systems follow AFSPCMAN 91-710; glass and structural glass bonds follow NASA-STD-5001.
