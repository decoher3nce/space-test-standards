kind: vocabulary
vocabulary: test_type
description: >
  Unified test types. One id per physical test or verification activity; the aliases carry each
  standard's own row heading so a matrix row can be read in the standard's words. The discipline
  attribute groups rows for rendering. Perceptiveness tags (what failure mechanisms the test exposes)
  are seeds for the coverage check and are not standard-derived unless a citation is given.
entries:
